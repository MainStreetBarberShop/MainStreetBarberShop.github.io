<body>

  <header>
    <h1>Maine Street Barber Shop</h1>
  </header>

  <div class="main-wrapper">
    <!-- Left Column (Desktop) / Top Card (Mobile): Storefront Visual -->
    <div class="storefront-card">
      <div class="storefront-photo" role="img" aria-label="Maine Street Barber Shop Storefront"></div>
    </div>

    <!-- Right Column (Desktop) / Bottom Stack (Mobile): Call to Action & Map -->
    <div class="info-column">
      <main class="card">
        <p>Classic cuts, straight-razor trims, and mountain hospitality.</p>
        <p style="color: var(--muted); font-size: 0.95rem;">Walk-ins welcome &bull; Florence, Colorado</p>
        <a href="tel:7192853724" class="btn">Call for Appointment</a>
      </main>

      <div id="map"></div>
    </div>
  </div>

  {% include footer.html %}

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      loadMapWithLocations();
    });

    function loadMapWithLocations() {
      var map = L.map('map').setView([38.389927, -105.116858], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
      }).addTo(map);

      fetch('/data/locations.json')
        .then(response => response.json())
        .then(data => {
          var bounds = [];
          data.features.forEach(feature => {
            const lat = feature.geometry.coordinates[0];
            const lng = feature.geometry.coordinates[1];
            const locationName = feature.properties.Name;

            var marker = L.marker([lat, lng]).addTo(map)
              .bindPopup(`<b>${locationName}</b>`, {
                autoClose: false,
                closeOnClick: false,
                closeButton: false
              })
              .openPopup();

            marker.off('click');
            marker.on('click', function() {
              this.openPopup();
            });

            bounds.push([lat, lng]);
          });

          if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [40, 40] });
          }
        })
        .catch(error => console.error('Error loading locations:', error));
    }
  </script>
</body>
</html>
