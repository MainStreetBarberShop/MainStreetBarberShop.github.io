title: Apollo-Atlas Jekyll Template  
description: The Apollo-Atlas Jekyll Template is a leg-up in starting your own website hosted on GitHub with content based in AsciiDoc.
plugins:
  - jekyll-paginate
  - jekyll-asciidoc
# uncomment baseurl if you want to publish the site to a subfolder
#baseurl: /blog

url: "https://mainestreetbarbershop.github.io"
baseurl: "https://mainestreetbarbershop.github.io"

# --- Starfire Industries Global Identity ---
company:
  name: "Starfire Industries AI"
  director: "Donald Scott Gould"
  email: "planesguard@starfire-industries-ai.com"
  phone: ""
  website: "https://www.starfire-industries-ai.com"
  slack: "https://starfireindustriesai.slack.com/"
  bluesky: "https://starfireindustries.bsky.social"
  youtube: "https://www.youtube.com/@GermanFAT8TrackRecords69"
  coffee: "https://buymeacoffee.com/starfirezac"

exclude:
  - LICENSE
  - README.adoc
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - _data/gallery01.json
  - _data/gallery02.json

asciidoc: {}
asciidoctor:
  base_dir: :docdir
  safe: unsafe
  attributes:
    icons: font
    idseparator: _
    stylesdir: css
    source-highlighter: coderay

collections:
  documents:
     output: true
  stories:
    output: true # Set to true to generate pages for each story
  artgallery01:
    output: false
  artgallery02:
    output: false
  artgallery03:
    output: false
  artgallery04:
    output: false
  pdfs:
    output: false
  newsletters:
    output: true
    


